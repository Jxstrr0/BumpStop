# Adapted from Mainline .github/workflows/publish-release.yml (25 November 2026)
#
# Publishes a GitHub Release for each new version of the game.
#
# Why: the Longlight site (longlight.games) reads each game's newest
# release to show its version number and "what's new" line. Without a
# release the site keeps showing an old, hand-typed number.
#
# How: on every push to main it reads the version from the VERSION file. If
# there is no release called v<version> yet, it makes one, titled from the
# commit that shipped it: here that is the merge's title, "PR 1a: summary
# — v<version> (#2)" (scripts/release-title.mjs reads it, and has a test).
# A version with a notes file, docs/releases/v<version>.md, uses it as the
# release's notes.
# A push that doesn't change the version does nothing.
#
# Free, and it uses no keys (only GitHub's own built-in token). It does not
# touch the game or its deploy, and the tag it makes starts no other
# workflow. Safe to delete; the site's number for this game would just
# stop updating.
name: Publish release
on:
  push:
    branches: [main]
permissions:
  contents: write # to create the release and its tag
concurrency:
  group: publish-release
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 50 # enough history to find this version's commit
          persist-credentials: false
      - name: Publish a release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "No four-number version found in the VERSION file (got '$V')"; exit 1
          fi
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists. Nothing to do."
            exit 0
          fi
          # The oldest recent commit whose title names this version is the
          # merge that shipped it. Its summary becomes the release title, and
          # the studio site shows that as the game's "what's new" line.
          SUMMARY=$(git log -50 --format=%s | node scripts/release-title.mjs "$V")
          # A big version can carry fuller notes in docs/releases/v<version>.md;
          # otherwise the summary is the notes.
          NOTES="docs/releases/v$V.md"
          if [ -f "$NOTES" ]; then
            gh release create "v$V" --target "$GITHUB_SHA" \
              --title "v$V - ${SUMMARY:-update}" \
              --notes-file "$NOTES"
          else
            gh release create "v$V" --target "$GITHUB_SHA" \
              --title "v$V - ${SUMMARY:-update}" \
              --notes "${SUMMARY:-Update}."
          fi
          echo "Published v$V."
